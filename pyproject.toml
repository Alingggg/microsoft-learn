[project]
name = "microsoft-learn-pipeline"
version = "0.1.0"
description = "Ingest daily Microsoft Learn catalog snapshots into PostgreSQL."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.3.5",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]

[tool.uv]
package = true

[project.scripts]
pipeline = "microsoft_learn_pipeline.main:main"